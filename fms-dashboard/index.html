<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FMS-1 DTC 儀表板</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="stage" id="stage">
    <img class="logo" src="assets/fms-logo-white.png" alt="iTRAQ FMS">

    <section class="kpi kpi--month" aria-label="本月累計DTC數">
      <h2 class="kpi__title">本月累計DTC數</h2>
      <p class="kpi__value"><span id="monthTotal"></span><span class="kpi__unit">次</span></p>
    </section>
    <section class="kpi kpi--gradeA" aria-label="DTC等級A累計次數">
      <h2 class="kpi__title">DTC等級A累計次數</h2>
      <p class="kpi__value"><span id="gradeATotal"></span><span class="kpi__unit">次</span></p>
    </section>

    <section class="chart" aria-label="每日DTC次數">
      <div class="meta">
        <ul class="legend" id="legend"></ul>
        <p class="updated">統計至：<span id="updatedAt"></span></p>
      </div>
      <div class="y-axis" id="yAxis"></div>
      <div class="grid-lines" id="gridLines"></div>
      <div class="bars" id="bars"></div>
      <div class="x-axis" id="xAxis"></div>
      <div class="tooltip" id="tooltip" role="status"></div>
    </section>

    <section class="log" aria-labelledby="logTitle">
      <header class="log__head">
        <div class="log__head-left">
          <img class="log__dot" src="assets/status-dot.svg" alt="" width="24" height="24">
          <h2 class="log__title" id="logTitle">近10筆A等級DTC追蹤表</h2>
          <button type="button" class="more-btn" id="moreBtn">
            <img src="assets/icon-read.svg" alt="" width="24" height="24">
            <span>查看更多</span>
          </button>
        </div>
        <span class="log__live">即時資料</span>
      </header>
      <ol class="log__list" id="logList"></ol>
    </section>
  </main>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
